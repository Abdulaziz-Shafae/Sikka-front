name: Notification UI checks
on:
  push:
    branches:
      - feature/notification-card-time-design
      - feature/notifications-approved-20261103
  pull_request:
    branches:
      - feature/notification-card-time-design
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Notification time cases
        run: node --experimental-strip-types scripts/checks/notification-time.mjs
      - name: UI flow checks
        run: pnpm check:flows
      - name: Integration contract checks
        run: pnpm check:integration
      - name: Production build
        run: pnpm build:railway
